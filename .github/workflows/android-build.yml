name: Android build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional release version (for example v1.0.0). Leave blank to run checks only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests and build debug APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Save debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SHENhero-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish release APKs
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Use a version like v1.0.0 or v1.0.0-rc.1."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          key_file="$RUNNER_TEMP/shenhero-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          echo "ANDROID_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          version_name="${RELEASE_VERSION#v}"
          gradle --no-daemon assembleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="$version_name"
          mkdir -p release_apks
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APKs were produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release_apks/SHEN-Hero-${RELEASE_VERSION}-$(basename "$apk")"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: SHEN Hero ${{ steps.version.outputs.value }}
          body: |
            Signed Android APKs built after unit tests and a debug build passed.

            Install the universal APK if you are unsure which device build to choose.
          files: release_apks/*.apk
          fail_on_unmatched_files: true
