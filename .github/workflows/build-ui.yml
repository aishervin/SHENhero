name: Build branded Termux UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "termux-skin/ui-src/**"
      - ".github/workflows/build-ui.yml"

permissions:
  contents: write

concurrency:
  group: branded-ui-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Build the local UI bundle
        working-directory: termux-skin
        run: bash ./ui-src/build.sh
      - name: Commit updated UI archive
        run: |
          if git diff --quiet -- termux-skin/ui.tar.gz; then
            echo "UI archive is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add termux-skin/ui.tar.gz
          git commit -m "Build SHΞN ʜᴇʀᴏ™ branded UI bundle"
          git push
